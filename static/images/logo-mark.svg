<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" role="img" aria-label="Sri Kowshi Builders">
  <!-- Simplified vector version of the building mark in logo.webp, so it
       stays crisp at header/favicon sizes and works on light backgrounds. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d98b"/>
      <stop offset="0.5" stop-color="#c99a3e"/>
      <stop offset="1" stop-color="#9c7425"/>
    </linearGradient>
  </defs>
  <!-- left tower with vertical fins -->
  <rect x="6" y="12" width="13" height="32" fill="url(#gold)"/>
  <rect x="9" y="16" width="1.6" height="28" fill="#0c1a16" opacity="0.85"/>
  <rect x="12.4" y="16" width="1.6" height="28" fill="#0c1a16" opacity="0.85"/>
  <rect x="15.8" y="16" width="1.6" height="28" fill="#0c1a16" opacity="0.85"/>
  <!-- upper block with glazing -->
  <path d="M17 6h33v4H17z" fill="url(#gold)"/>
  <rect x="19" y="10" width="29" height="18" fill="url(#gold)"/>
  <rect x="23" y="13" width="23" height="12" fill="#0c1a16" opacity="0.9"/>
  <path d="M28.5 13v12M34 13v12M39.5 13v12" stroke="#c99a3e" stroke-width="0.6" opacity="0.6"/>
  <!-- lower cantilever block -->
  <rect x="25" y="25" width="34" height="19" fill="url(#gold)"/>
  <rect x="45" y="30" width="10" height="14" fill="#0c1a16" opacity="0.9"/>
  <!-- ground line -->
  <rect x="1" y="44" width="62" height="1.6" rx="0.8" fill="url(#gold)"/>
</svg>
